[project]
name = "thrml-playground"
version = "0.1.0"
description = "Learning playground and experiments with Extropic's THRML library"
readme = "README.md"
authors = [
    { name = "aquinjay", email = "103866978+aquinjay@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.4",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "thrml>=0.1.4",
]

[project.scripts]
thrml-playground = "thrml_playground:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
